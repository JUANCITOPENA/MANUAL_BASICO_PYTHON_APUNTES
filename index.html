<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐍 Manual Paso a Paso de Python | Ing. Juancito Peña</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Manual Maestro de Python - Guía Completa con Algoritmos y Gráficos">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <style>
    :root {
      --theme-color: #2F6D9C;
      --docsify_darklight_theme_accent: #2F6D9C;
    }
    .sidebar {
      font-size: 15px;
    }
    .markdown-section {
      max-width: 950px;
      padding: 30px 40px;
    }
    .markdown-section pre>code {
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .app-name-link {
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Manual Maestro de Python...</div>
  <script>
    window.$docsify = {
      name: '🐍 Python Manual Pro',
      repo: 'https://github.com/JUANCITOPENA/MANUAL_BASICO_PYTHON_APUNTES',
      loadSidebar: false,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Buscar en el manual...',
        noData: 'No se encontraron resultados',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: '¡Copiado!'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <!-- Prism Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
